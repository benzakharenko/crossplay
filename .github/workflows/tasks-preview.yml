name: Tasks fork - screen previews

# Builds the X4 Pro simulator, photographs the Tasks app with canned Notion
# replies (tasks_fork/preview/shoot.sh), and commits the PNGs and traces to
# the tasks-shots branch. Runs on pushes to tasks-preview only: nothing here
# builds firmware or publishes a release.

on:
  push:
    branches: [tasks-preview]
  workflow_dispatch:

concurrency:
  group: tasks-preview
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  shots:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: false

      - name: Install PlatformIO Core
        run: |
          uv pip install --system -U https://github.com/pioarduino/platformio-core/archive/refs/tags/v6.1.19.zip
          uv pip install --system -U pillow

      - name: Install the simulator's host libraries
        run: sudo apt-get update && sudo apt-get install -y libsdl2-dev libssl-dev xvfb

      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-sim-${{ runner.os }}-${{ hashFiles('platformio.sim.ini', 'platformio.ini') }}
          restore-keys: pio-sim-${{ runner.os }}-

      - name: Build and photograph
        run: |
          set -euo pipefail
          mkdir -p shots
          pio run -e simulator_x4_pro > shots/build.log 2>&1 || { tail -60 shots/build.log; exit 1; }
          tasks_fork/preview/shoot.sh .pio/build/simulator_x4_pro/program shots tasks
          ls -la shots

      - name: Commit shots to tasks-shots
        if: always()
        run: |
          set -euo pipefail
          sha="$(git rev-parse --short HEAD)"
          rm -f shots/*-build.log.tmp
          cd shots
          git init -q -b tasks-shots
          git config user.name "tasks-fork-bot"
          git config user.email "tasks-fork-bot@users.noreply.github.com"
          echo "Preview of $sha" > README.md
          git add -A
          git commit -q -m "shots for $sha"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" tasks-shots
